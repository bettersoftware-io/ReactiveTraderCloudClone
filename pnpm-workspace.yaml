packages:
  - "packages/*"
  - "tests"
# Install-script allowlist (pnpm 11 strictDepBuilds): pnpm blocks dependency
# lifecycle scripts by default; only the packages set to `true` here may execute
# code at install time. Both are trusted build/test tooling that need native
# binaries — esbuild (the bundler under vite/vitest/tsx) and
# @shopify/react-native-skia (its postinstall fetches Skia's prebuilt native
# libs, required for the native iOS/Android build later).
allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true

# Supply-chain cooldown: refuse to install any package version published fewer
# than this many minutes ago (1440 = 24h). This is pnpm 11's default, pinned
# explicitly so the policy is visible in-repo and survives any future change to
# the default. Add packages to `minimumReleaseAgeExclude` to bypass per-package.
minimumReleaseAge: 1440

# GHSA-mh99-v99m-4gvg (brace-expansion DoS): the advisory originally shipped
# one collapsed unbounded range (<=5.0.7) that false-positived the CJS-locked
# 1.x/2.x lines, which forced an ignoreGhsas suppression here. On 2026-08-01
# the advisory was corrected with real per-major ranges (<1.1.17; >=2.0.0
# <2.1.3; the 5.x fix stays 5.0.8) — the exact drop condition the old comment
# recorded. All three majors are now forced to their patched tips in
# `overrides` below, and the suppression is gone.
overrides:
  # Force the transitive brace-expansion 1.x line (arrives via minimatch/glob
  # in dozens of prod-reachable paths, e.g. client-react-native > react-native
  # > @react-native/jest-preset > … > test-exclude > minimatch) up from the
  # vulnerable <1.1.17 to the PATCHED 1.1.17. Fixes the HIGH DoS advisory
  # GHSA id 1123897 (exponential-time expansion of consecutive non-expanding
  # {} groups), which reds CI gate 25 (`pnpm audit --prod`). SCOPED to the
  # vulnerable range so consumers already on a safe version (incl. the 2.x
  # line, patched separately as 2.1.2) are never forced off their choice.
  # 1.1.17 ships the corrected per-major fix for GHSA-mh99-v99m-4gvg.
  "brace-expansion@<1.1.17": ^1.1.17
  # The SAME DoS advisory (GHSA-mh99-v99m-4gvg) also lands on the newer 5.x
  # line: brace-expansion@5.0.7 arrives transitively via @gorhom/bottom-sheet
  # (the RN trade-ticket sheet). Keyed to the whole 5.x major (not the exact
  # 5.0.7 — that only matched some of the 100 paths, leaving 5.0.7 behind) so
  # every 5.x resolution is lifted, while the safe 1.x / 2.x lines (below
  # major 5) are untouched.
  # 2026-08-04: floor raised 5.0.8 → 5.0.9 for the FOLLOW-UP HIGH advisory
  # GHSA-rgw5-rvv9-x895 (DoS via unbounded intermediate arrays, bypassing the
  # CVE-2026-14257 mitigation; vulnerable >=4.0.0 <5.0.9 — no 4.x resolves
  # here, so lifting 5.x closes it). 5.0.9 published 2026-07-30 — outside the
  # minimumReleaseAge cooldown.
  "brace-expansion@5": ^5.0.9
  # Same advisory, 2.x line: force it to the maintenance-v2 patch 2.1.3 (the
  # advisory's corrected per-major fix; 2.1.2 remained vulnerable). minimatch@10 asks ^2.0.1, so a
  # 2.1.x patch bump is safe. Scoped to major 2 so 1.x / 5.x are untouched.
  "brace-expansion@2": ^2.1.3
  # Force the transitive postcss (Expo build tooling — expo > @expo/cli >
  # @expo/metro-config, and expo-blur > expo > @expo/…) up from the vulnerable
  # 8.5.16 to the PATCHED 8.5.18. Fixes the HIGH path-traversal advisory
  # GHSA-r28c-9q8g-f849 (Previous Source Map path traversal), which reds CI
  # gate 25 (`pnpm audit --prod`). SCOPED to the vulnerable range so a consumer
  # already on the patched version keeps its choice.
  # 2026-08-04: floor raised 8.5.18 → 8.5.23 for the follow-up MODERATE
  # advisory (incomplete fix of GHSA-6g55-p6wh-862q: attacker-controlled
  # sourceMappingURL reads arbitrary .map files when `from` is unset;
  # vulnerable <=8.5.22). Moderate does not red gate 25, fixed for hygiene
  # while touching the file. 8.5.23 published 2026-07-24 — outside the
  # minimumReleaseAge cooldown.
  "postcss@<8.5.23": ^8.5.23
  # Force the transitive @xmldom/xmldom (pulled in by @expo/plist and plist —
  # Expo native-build tooling, exercised by `expo prebuild`/`run:ios` and every
  # `eas build`) up from the vulnerable <0.8.13 line to the PATCHED 0.8.13.
  # SCOPED to the vulnerable range (like uuid@11 above) so a future consumer
  # resolving an already-safe xmldom (>=0.8.13) is never forced off its choice.
  # Fixes 5 high XML-injection GHSA advisories (GHSA-wh4c-j3r5-mjhp,
  # GHSA-2v35-w6hq-6mfw, +3 related, all <0.8.13) — 0.8.13 is the minimal
  # version that patches every one of them.
  # NOTE — DO NOT bump this to 0.9.x. xmldom 0.9.0 made the `mimeType` argument
  # of `DOMParser.parseFromString` REQUIRED, but @expo/plist@0.8.0 still calls it
  # one-arg — so 0.9.x throws `mimeType "undefined" is not valid` inside the iOS
  # infoPlist base-mod during prebuild, breaking `expo run:ios` and all EAS
  # native builds. (A prior override pinned ^0.9.10 on the assumption the native
  # path was never exercised; the SDK-57 native-build work proved that wrong.)
  # 0.8.13 keeps the pre-0.9 one-arg DOMParser API @expo/plist depends on.
  "@xmldom/xmldom@<0.8.13": ^0.8.13
  # Force the transitive fast-uri (arrives via ajv@8 — schema $ref URI parsing,
  # itself reached through the eslint/webpack-adjacent tool chain) up from the
  # vulnerable 3.1.3 to the PATCHED 3.1.4. Fixes the HIGH host-confusion
  # advisory (literal-backslash authority: `fast-uri` parsed `http:/\evil.com`
  # as host `evil.com`, so a URI allowlist check could be bypassed) — range
  # `>=3.0.0 <=3.1.3`. Dev-scope only, so `pnpm audit --prod` (gate 25) never
  # saw it; it surfaced via the Dependabot alert list instead.
  # SCOPED to the vulnerable range so a consumer already on a safe version
  # keeps its choice. Deliberately stays on the 3.x line: the in-line patch
  # suffices, so no major 3->4 lift is needed (fast-uri 4.x is available but
  # would change the API surface ajv@8 compiles against for no security gain).
  # 2026-08-04: floor raised 3.1.4 → 3.1.5 for the FOLLOW-UP HIGH advisory
  # GHSA-7p8r-x3mc-p8w7 (host confusion via backslash authority introducer;
  # vulnerable >=3.0.0 <3.1.5). Unlike the 3.1.4 round this one IS
  # prod-reachable — @modelcontextprotocol/sdk > ajv > fast-uri — so it reds
  # gate 25 directly. 3.1.5 published 2026-07-31 — outside the
  # minimumReleaseAge cooldown.
  "fast-uri@<3.1.5": ^3.1.5
  # Force the transitive undici 7.x (dev-only: vitest > jsdom > undici) up
  # from the vulnerable 7.28.0 to the PATCHED 7.29.0 — which closes FIVE
  # advisories at once, all patched in 7.29.0: the HIGH GHSA-4cwx-7wf7-3272
  # (cross-user information disclosure + parse-time crash via degenerate
  # `private` cache directives) plus 4 moderates (GHSA-8xcm-r25x-g524,
  # GHSA-m8rv-5g2x-5cg5, GHSA-jr45-8vmc-qm54, GHSA-v3r7-h72x-cjcm).
  # Dev-scope, so gate 25
  # (`pnpm audit --prod`) never reds on it — fixed preemptively because the
  # fast-uri 3.1.4 round proved dev-only HIGHs surface as Dependabot alerts
  # anyway. SCOPED to the vulnerable range so a consumer already on >=7.29.0
  # keeps its choice. 7.29.0 published 2026-07-24 — outside the
  # minimumReleaseAge cooldown.
  "undici@>=7.0.0 <7.29.0": ^7.29.0
  # Force the transitive uuid up from 7.0.3 to 11.1.1. Fixes GHSA-w5hq-g745-h8pq
  # (MEDIUM: missing buffer bounds check in the v3/v5/v6 generators when the
  # optional `buf` output argument is supplied — note those are uuid ALGORITHM
  # versions, not package majors).
  #
  # Sole consumer is `xcode@3.0.1` (declares uuid ^7.0.3), reached via
  # @expo/config-plugins — i.e. Expo native-build tooling exercised by
  # `expo prebuild` / `expo run:ios` and every EAS build, and by nothing the unit
  # or e2e suites touch. That is exactly the path the @xmldom/xmldom note below
  # warns about, so this lift was checked against xcode's REAL usage rather than
  # assumed safe:
  #   - xcode calls `uuid.v4()` and nothing else (lib/pbxProject.js:90) — it
  #     never touches v3/v5/v6, and never passes a `buf`, so the vulnerable code
  #     path was unreachable here to begin with. This bump is hygiene, not a
  #     live-exploit fix.
  #   - xcode consumes it as CommonJS (`require('uuid')`), and uuid@11 still
  #     ships a CJS entry: `require('uuid').v4()` verified working on 11.1.1.
  # The two ways this class of lift has broken us before (a required argument
  # appearing, and a CJS/ESM export-shape change) are therefore both excluded.
  #
  # SCOPED to the vulnerable range so a consumer already on >=11.1.1 keeps its
  # choice. 11.1.1 published 2026-04-29 — well outside the minimumReleaseAge
  # cooldown.
  "uuid@<11.1.1": ^11.1.1
  # Pin @expo/metro-runtime to the SDK-57 line. It arrives as a PEER dep via
  # `expo`'s loose `*` range, and the minimumReleaseAge cooldown above steered
  # pnpm to the aged 4.0.1 (SDK-52 era) instead of the 57.0.3 that expo-router
  # actually requires and expo's bundledNativeModules pins for SDK 57.
  # 4.0.1 is fatal on RN 0.86: its messageSocket.native.ts calls
  # `require("react-native/.../getDevServer")()` expecting the OLD CJS contract
  # (module.exports = fn), but RN 0.86 ships getDevServer as an ESM
  # `export default`, so the require yields the namespace object → the app
  # crashes at boot with `TypeError: getDevServer is not a function (it is
  # Object)`. 57.0.3 removed that broken consumer entirely and uses a proper
  # ESM import, matching RN 0.86 by construction. Without this override the
  # peer re-resolves to 4.0.1 on every install.
  "@expo/metro-runtime": ~57.0.3
  # react-native-reanimated@4.5.0 + react-native-worklets: two overrides keep
  # the RN native Metro bundle compiling. Neither failure is visible to the
  # jest/vitest suite — worklets is disabled under jest and Metro is never run;
  # the CI `expo export` step (ci.yml) is the only exerciser.
  #
  # (1) VERSION: pin worklets to the SDK-57-blessed 0.10.0 that reanimated@4.5.0
  # was BUILT against (its own devDependency is react-native-worklets@0.10.0, and
  # expo's bundledNativeModules for SDK 57 pins 0.10.0). The worklets babel plugin
  # and the worklets runtime must be the SAME version or the transform emits code
  # the runtime mis-reads (`Cannot read properties of undefined (reading 'length')`
  # while transforming reanimated's own Easing.ts) — see the Reanimated
  # troubleshooting guide. reanimated peers `0.10.x`, so a natural install lets
  # pnpm float the peer to 0.10.1 (a MISMATCH vs the 0.10.0 plugin); force 0.10.0
  # everywhere so plugin == runtime == the tested pair.
  react-native-worklets: 0.10.0
  # (2) BABEL: worklets' nested babel transform (its @babel/preset-typescript@^7)
  # hard-asserts the caller's @babel/core is ^7, but worklets declares @babel/core
  # peer `*` so pnpm otherwise hands it the workspace-hoisted @babel/core@8.0.1
  # (pulled at ^8 by client-react/devtools-app for React Compiler) → throws
  # `Requires Babel "^7.0.0-0", but was loaded with "8.0.1"`. Scope @babel/core to
  # 7.29.7 INSIDE the worklets subtree only — the web packages keep @babel/core@8,
  # and syncpack is unaffected (an override is not a package.json dep). 7.29.7 is
  # already in the tree.
  "react-native-worklets>@babel/core": 7.29.7
  # (3) BABEL GENERATOR/TRAVERSE: (2) scopes @babel/CORE to 7.29.7 inside worklets,
  # but the plugin's makeWorkletFactory calls @babel/generator (and @babel/traverse)
  # DIRECTLY, not via @babel/core — pnpm otherwise resolves those to the
  # workspace-hoisted 8.0.0 (pulled at ^8 by client-react/devtools-app). A Babel-8
  # generator printing the Babel-7 AST the plugin just built (a worklet's
  # TSFunctionType param list) reads a field the 8.x node shape lacks →
  # `Cannot read properties of undefined (reading 'length')` in @babel/generator's
  # Printer._parameters, thrown from makeWorkletFactory on reanimated's
  # Easing.ts / isSharedValue.ts. This is the SAME error signature as the version
  # mismatch in (1) but a DIFFERENT cause (generator/traverse, not the worklets
  # runtime). The pin now lives in packageExtensions below, NOT as a
  # `react-native-worklets>@babel/generator` override — see that block for why
  # the override form is a silent no-op here.

# Force @babel/core@7 for the RN Metro babel toolchain. The main Metro transform
# runs through @expo/metro-config's babel-transformer, whose `require("@babel/core")`
# otherwise resolves the workspace-hoisted @babel/core@8.0.1 (pulled at ^8 by
# client-react/devtools-app for React Compiler). That made the MAIN pass Babel 8
# while worklets' nested pass ran the scoped Babel 7 above — cross-version AST
# mixing that crashed the x86 Metro bundle (`reading 'length'` in worklets'
# plugin on reanimated's Easing.ts; invisible to the jest/vitest suite and to
# arm64-local, only caught by CI's `expo export`). Giving @expo/metro-config its
# own @babel/core@7.29.7 makes the whole RN transform uniformly Babel 7.
# This is done via packageExtensions (NOT a client-react-native devDependency) so
# neither manypkg nor syncpack sees an @babel/core version split — the web packages
# keep @babel/core@8. @expo/metro-config is RN-only (web builds with Vite), so this
# cannot affect the web bundles.
packageExtensions:
  "@expo/metro-config":
    dependencies:
      "@babel/core": "7.29.7"
  # Pin @babel/generator + @babel/traverse to 7.29.7 INSIDE the worklets subtree.
  # react-native-worklets' babel plugin (plugin/index.js:869/1006/1499/1500)
  # `require("@babel/generator")`/`require("@babel/traverse")` DIRECTLY, but the
  # package declares NEITHER as a dependency (only `@babel/core: *`). So a pnpm
  # `react-native-worklets>@babel/generator` OVERRIDE has no dependency edge to
  # bind to and is a SILENT NO-OP — the plugin instead falls back to Node's
  # upward resolution and picks up whatever @babel/generator happens to be
  # hoisted into reach, which is @8.0.0 (pulled to the top by the web's React
  # Compiler @babel/core@8). A Babel-8 generator printing the Babel-7 AST the
  # plugin built → `reading 'length'` (see the overrides note above). This was
  # never actually fixed by the override; it only "worked" while a lucky hoist
  # put generator@7.29.7 in reach, and regressed whenever the hoist flipped.
  # packageExtensions ADDS the real dependency edge, so pnpm installs
  # generator@7.29.7 + traverse@7.29.7 into worklets' OWN subtree and the
  # plugin's require() resolves them locally — hoist-independent. Scoped to
  # worklets only; the web keeps @babel/*@8. Same rationale (and same manypkg /
  # syncpack invisibility) as the @expo/metro-config extension above.
  react-native-worklets:
    dependencies:
      "@babel/generator": "7.29.7"
      "@babel/traverse": "7.29.7"
