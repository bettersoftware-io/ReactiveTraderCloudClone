app = "rtc-clone-server"
primary_region = "lhr"

[build]
  dockerfile = "packages/server/Dockerfile"

# Scale-to-zero: this is a share-with-friends demo, so the machine sleeps when
# idle (no traffic) and Fly's router auto-wakes it on the next request (~2-5s
# cold start). min_machines_running = 0 lets it go fully to zero → ~$0 idle cost.
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # §9.2 — Fly's only load-shedding knob. Past hard_limit the proxy refuses
  # new connections to this machine instead of letting it run out of memory
  # (256 MB). The app's own MAX_CONNECTIONS_TOTAL (200, in
  # packages/server/src/config/limits.ts) sits below, so the app says no
  # (503 on the upgrade) before the proxy starts queueing. WebSockets are
  # long-lived, so the unit is connections, not requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 220
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
