name: e2e workers probe

# TEMPORARY measurement, not for merge. Paired experiment: every Playwright
# worker count runs on the SAME runner (three runners, order rotated), with the
# react and solid browser suites concurrent as in the e2e job.
on:
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  probe:
    name: workers probe (${{ matrix.order }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        order: ["1 2 3 1", "2 1 3 2", "3 1 2 3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: scripts/enable-corepack.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtc/tests exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Paired runs
        env:
          ORDER: ${{ matrix.order }}
        run: |
          nproc
          for w in $ORDER; do
            vmstat 5 > "vmstat-$w.log" &
            vmstat_pid=$!
            start=$(date +%s)
            (cd tests && RTC_DEV_PORT=3001 pnpm test:browser:playwright --workers="$w" --reporter=dot > "../react-$w.log" 2>&1; echo "react exit $?" >> "../react-$w.log") &
            react_pid=$!
            (cd tests && RTC_DEV_PORT=3003 RTC_CLIENT_PKG=@rtc/client-solid pnpm test:browser:playwright --workers="$w" --reporter=dot > "../solid-$w.log" 2>&1; echo "solid exit $?" >> "../solid-$w.log") &
            solid_pid=$!
            wait "$react_pid" "$solid_pid"
            end=$(date +%s)
            echo "RESULT workers=$w wall=$((end - start))s"
            kill "$vmstat_pid"
            awk 'NR>3 {r+=$1; us+=$13; sy+=$14; id+=$15; n++} END {printf "  cpu: run-queue %.1f, us %.0f sy %.0f idle %.0f\n", r/n, us/n, sy/n, id/n}' "vmstat-$w.log"
            grep -hE "[0-9]+ (passed|failed|flaky)|exit [0-9]" "react-$w.log" "solid-$w.log" | sed 's/^/  /' || true
          done
