name: Deploy Prototype

# On-demand deploy of the @rtc/client-prototype React port (the readable,
# self-contained port of the v2 design) to the rtc-clone-proto Vercel project
# (https://rtc-clone-proto.vercel.app), behind a Basic-Auth gate. Separate from
# the main app's Deploy workflow AND from the "Deploy Claude Design Prototype"
# workflow (which ships the hand-authored HTML mockup) — this never auto-runs and
# touches only the proto project. Run it from the Actions tab ("Run workflow") or:
#   gh workflow run deploy-proto.yml
#
# Requires the repo secret VERCEL_PROTO_PROJECT_ID (the rtc-clone-proto
# project's prj_… id) — see deploy/proto/README.md for one-time setup. (A
# project id isn't sensitive, so a Variable would work too; it's kept a
# Secret to match the main app's VERCEL_PROJECT_ID convention.)
on:
  workflow_dispatch:

concurrency:
  group: deploy-proto
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-proto:
    name: client-prototype → vercel
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes: keep the token out of .git/config (zizmor
          # `artipacked`; see docs/adr/ADR-007).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Enable Corepack
        # Lockfile-pinned (sha512), not an ad-hoc `npm install -g`: see the header of
        # scripts/enable-corepack.sh. Must run AFTER checkout — the script is in-repo.
        run: scripts/enable-corepack.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI version lives in ONE place: scripts/ci-tooling/vercel/package.json.
      # Bump a MAJOR deliberately and prove it with a Deploy dispatch — CI cannot
      # vet one, and 58.0.0 once broke `vercel pull` under env-var project linking.
      - name: Install Vercel CLI
        # Lockfile-pinned (sha512) with audited overrides, not an ad-hoc
        # `npm install -g`: see the header of scripts/install-vercel.sh.
        run: scripts/install-vercel.sh

      - name: Build @rtc/client-prototype, generate gate, deploy, smoke
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROTO_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash deploy/proto/deploy.sh
