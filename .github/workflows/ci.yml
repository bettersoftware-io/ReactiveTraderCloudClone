name: CI

# Fast gates (typecheck, unit tests, build, the architecture + supply-chain
# grep/audit gates) plus the e2e suite. The e2e job is the heavy one
# (Playwright Chromium, the parallel orchestration in tests/scripts/run-all.ts
# — the PR gate runs 5 of the 7 suites: 3 non-browser + 2 native-Playwright
# browser suites (react + solid); the two Gherkin browser peers
# (playwright-cucumber, react + solid) are parked here and run weekly instead
# — see e2e-gherkin-weekly.yml and tests/STRATEGY.md §7.1); it runs alongside
# the fast jobs so it never slows them down.
#
# The ~20-min visual-diff gate is DELIBERATELY NOT here: it runs post-merge only,
# in its own workflow (.github/workflows/visual.yml, triggered on push to main),
# so branch pushes / PRs are never blocked while the UI is churning. A post-merge
# failure on main is the signal to inspect → fix the regression or (if intended)
# regenerate the goldens. Restore it as a PR gate here once the UI stabilises.
#
# All third-party actions are pinned to immutable commit SHAs (with the human
# version in a trailing comment). Renovate (helpers:pinGitHubActionDigests in
# .github/renovate.json5) keeps the digests current.
on:
  pull_request:
  push:
    branches: [main]
  # Manual escape hatch (mirrors visual.yml): lets a branch re-verify when a
  # pull_request synchronize event fails to materialize a run.
  #
  # Before reaching for it, check `gh pr view <n> --json mergeable`. If the PR is
  # CONFLICTING, no run was ever created and none ever will be — pull_request
  # workflows build the computed MERGE commit, and that ref cannot exist while the
  # PR conflicts. (CodeQL still runs; it uses refs/pull/N/head.) Neither a dispatch
  # nor an empty-commit re-trigger can help — resolve the conflict instead. A
  # dispatch run also does not satisfy the required PR contexts (see #291), so this
  # hatch is for genuinely-missing runs on a MERGEABLE PR only.
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm is provisioned by Corepack from the `packageManager` pin; silence its
  # first-run download prompt so non-interactive CI never stalls.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Minimal token: the checks and e2e jobs only read the repo (test + lint) — no
# job pushes, comments, or publishes. (CodeQL actions/missing-workflow-permissions.)
permissions:
  contents: read

jobs:
  checks:
    name: typecheck · test · build · gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Enable Corepack (pins pnpm 11.5.2 from the packageManager field)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache the pnpm content-addressable store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # --frozen-lockfile fails if the lockfile is out of date, and under pnpm 11
      # it also enforces the supply-chain policy: the minimumReleaseAge cooldown
      # and the allowBuilds install-script allowlist. A PR that introduces a
      # too-fresh (<24h) dependency, an unvetted build script, or a stale lockfile
      # is rejected here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format (Biome)
        run: pnpm exec biome ci .

      - name: ESLint (AST rules)
        run: pnpm lint:eslint

      - name: Custom ESLint rule tests (RuleTester)
        run: pnpm test:rules

      - name: CSS lint (stylelint)
        run: pnpm lint:css

      - name: Workflow lint (actionlint)
        run: pnpm lint:actions

      - name: Docs link check (files + anchors)
        run: pnpm check:doc-links

      - name: Presenter manifest drift (web ↔ React Native)
        run: pnpm check:manifest-drift

      - name: Prototype deviation corpus (manifest ↔ tree)
        run: pnpm check:prototype-shots

      - name: Playwright container image tag drift (single-source pin)
        run: pnpm check:image-tag-drift

      - name: Lint-warnings ledger drift (docs/lint-warnings.md)
        run: pnpm check:lint-warnings-drift

      - name: Version consistency (manypkg + syncpack)
        run: pnpm check:versions

      - name: Workspace script coverage (every package wired to the gates)
        run: pnpm check:scripts

      - name: React package policies (compiler / memo-ban / react-hooks all explicit)
        run: pnpm check:react-policies

      - name: React Compiler coverage
        run: pnpm check:compiler

      # The ONLY automated guard on the Reanimated worklet class: jest disables
      # the worklet Babel plugins and mocks reanimated wholesale, so a green
      # suite says nothing about it. Five boot scenes shipped blank behind that
      # blind spot (#413 → fixed 2026-07-31).
      - name: Worklet capture safety (RN + motion-core)
        run: pnpm check:worklet-order

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit)
        run: pnpm test

      - name: Pages tooling unit tests
        run: pnpm --filter @rtc/tests test:pages

      # The cucumber teardown policy decides whether a green run is allowed to go
      # red. Its interesting branch only fires when a shutdown overruns its
      # budget — a condition no run can summon on demand — so it is gated here
      # rather than left to the e2e job, which would never exercise it.
      - name: Cucumber hooks unit tests
        run: pnpm --filter @rtc/tests test:hooks

      # The ui:contract coverage gate over the whole src/ui surface (≥95%). It
      # runs the neutral sociable contract specs AND the co-located src/ui unit
      # tests, so the percentage reflects their true combined coverage.
      - name: UI contract coverage gate (≥95%)
        run: pnpm --filter @rtc/client-react test:ui:contract:coverage

      # Same gate, same neutral specs, second framework: proves the Solid port
      # carries the react coverage bar (replaceability §8.1 full-parity).
      # Branches gate at 85 (not 95) — Solid's compiled reactive-effect guards
      # inflate v8's branch denominator; rationale in the coverage config.
      - name: UI contract coverage gate — solid (≥95%, branches ≥85%)
        run: pnpm --filter @rtc/client-solid test:ui:contract:coverage

      - name: Build
        run: pnpm build

      - name: Prod /devtools/ bundle check
        run: pnpm check:devtools-dist

      # This step used to tolerate ONE failure signature: worklets' Babel plugin
      # throwing `Cannot read properties of undefined (reading 'length')` on
      # reanimated's Easing.ts, x86-Linux only. That crash had FOUR documented
      # causes (see pnpm-workspace.yaml: worklets plugin/runtime version skew,
      # @babel/core@8 inside the worklets subtree, @babel/generator+traverse@8
      # resolved by makeWorkletFactory's direct require(), and @expo/metro-config
      # running the main pass on Babel 8) — all four are now fixed there, and the
      # export completes cleanly on this runner. Measured 2026-08-08 on main run
      # 31259176893: zero exceptions, zero warnings, `Exported: dist`. So the
      # tolerance was dead code that could only hide a future regression, and a
      # plain invocation is the honest gate. Do not re-add a signature filter
      # without a run id proving the signature is live.
      - name: Expo bundle smoke (Metro monorepo resolution)
        run: pnpm --filter @rtc/client-react-native export

      - name: Dead code (knip)
        run: pnpm lint:dead

      - name: Dependency graph (cycles + layering)
        run: pnpm check:deps

      - name: ESLint (type-aware rules)
        run: pnpm lint:eslint:types

      - name: Architecture + supply-chain gates (grep gates + pnpm audit --prod)
        run: pnpm --filter @rtc/tests gates

  e2e:
    name: e2e (browser · presenter · fullstack)
    runs-on: ubuntu-latest
    env:
      # The 2-vCPU runner can't sustain the full parallel fan-out (it starves
      # the timing-sensitive WS smoke into timeouts). Cap the pool to 2 suites
      # at a time — slower wall-clock, but reliable. run-all.ts defaults to
      # fully parallel when this is unset (multi-core dev boxes).
      RTC_E2E_MAX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Enable Corepack (pins pnpm 11.5.2 from the packageManager field)
        run: npm install -g corepack@0.35.0 && corepack enable

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache the pnpm content-addressable store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e browser suites run Playwright (cucumber-driven + raw) against
      # Chromium; install it from the @rtc/tests package (the one that launches it).
      - name: Install Playwright Chromium + OS deps
        run: pnpm --filter @rtc/tests exec playwright install --with-deps chromium

      # Invoke through turbo (root script = `turbo run test:e2e`, NOT
      # `pnpm --filter`) so the task's dependsOn ["build"] builds every workspace
      # lib first — the suites import @rtc/{domain,shared,client,server} via their
      # dist/. turbo then runs `pnpm gates` + the parallel orchestrator.
      #
      # RTC_E2E_SKIP_GHERKIN_BROWSER=1 parks the two Gherkin browser peers
      # (playwright-cucumber, react + solid): native Playwright is the gating
      # browser SOT (tests/STRATEGY.md §7.1), so the PR gate runs 5 of the 7
      # suites. The weekly e2e-gherkin-weekly.yml workflow runs the two parked
      # suites so the .feature/step tree can't silently rot.
      - name: e2e suite (Playwright + presenter + fullstack)
        run: RTC_E2E_SKIP_GHERKIN_BROWSER=1 pnpm test:e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            tests/reports/
          if-no-files-found: ignore
          retention-days: 7
