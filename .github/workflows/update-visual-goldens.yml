name: Update visual goldens

# Manually-triggered (workflow_dispatch) regeneration of the visual golden
# screenshots, rendered INSIDE the same Playwright container the `visual` job in
# ci.yml uses — so the goldens match CI byte-for-byte and stop failing on
# cross-platform font/sub-pixel differences. Keep the container tag in sync with
# the `visual` job in ci.yml.
#
# Two modes, chosen by the `scenario_pattern` dispatch input:
#   - EMPTY (default) → full refresh: wipe the canonical react/ tree, then
#     re-render all ~1282 scenarios for the sole `playwright` tier.
#   - SET (e.g. `aurora`, `credit/new-rfq-open`) → targeted refresh: SKIP the
#     wipe and pass the pattern to the runner (playwright `-g`), so only the
#     matching goldens are re-rendered — a one-scenario change costs seconds
#     instead of ~20 minutes, and can't drag in unrelated in-flight golden work.
#     (A targeted refresh measured 2m01s; a full one ~19-20 min across five runs
#     on 2026-07-28. The old "~11 min" figure predates the matrix reaching 1,462
#     goldens.)
#
# The goldens a run changed are then losslessly recompressed with a pinned
# oxipng (~26% smaller, pixel-identical; see that step).
#
# It then AUTO-COMMITS the regenerated goldens straight to the dispatched branch
# (scoped to the canonical react/ tree only — never a partial react-local/ set)
# using the workflow's GITHUB_TOKEN, so there is no artifact → download →
# cherry-pick → commit round-trip. The artifact is still uploaded as a
# fallback. The commit is `[skip ci]` (and GITHUB_TOKEN pushes don't retrigger
# workflows anyway), so it never loops.
#
# SCOPE: refreshes ONLY the canonical x86 `react/` set (the CI-enforced baseline)
# — react-only BY DESIGN. The goldens are react-owned; the Solid client
# (@rtc/client-solid) never gets its own set — its visual tiers assert the SAME
# scenarios against these react goldens (see visual.yml), so regenerating here is
# sufficient for both clients. It does NOT touch the per-arch
# `react-local/<platform>-<arch>/` sets used for local feedback — those never
# match the x86 pixels and no CI runner reproduces them. After an intentional UI
# change you must ALSO regenerate your local set on your own machine and commit
# it (see packages/client-react/tests/ui/visual/ADR-001-visual-diff-tooling.md,
# "Cross-platform pixel drift").
on:
  workflow_dispatch:
    inputs:
      scenario_pattern:
        description: >-
          Optional test-title filter (playwright -g). Empty = full refresh
          (wipe + re-render all). Set = targeted refresh of only the matching
          scenarios (no wipe). e.g. "aurora", "credit/new-rfq-open".
        required: false
        default: ""

# Read-only by default; the `update` job is granted write below (it pushes the
# regenerated goldens). Scoped to the job so a second job added later cannot
# inherit a write token by accident. (Scorecard TokenPermissions; ADR-007.)
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  update:
    name: regenerate goldens (Playwright container)
    runs-on: ubuntu-latest
    permissions:
      # The auto-commit step pushes regenerated goldens to the dispatched branch.
      contents: write
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      SCENARIO_PATTERN: ${{ inputs.scenario_pattern }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job pushes (gh-pages / golden commit) with the checkout's token, so it
          # must stay in .git/config — every OTHER checkout in this repo sets false
          # (zizmor `artipacked`; see docs/adr/ADR-007).
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        # Lockfile-pinned (sha512), not an ad-hoc `npm install -g`: see the header of
        # scripts/enable-corepack.sh. Must run AFTER checkout — the script is in-repo.
        run: scripts/enable-corepack.sh

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache the pnpm content-addressable store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runners are invoked directly (bypassing turbo), so build the workspace
      # libs first or vite can't resolve @rtc/domain.
      - name: Build workspace libraries
        run: pnpm build

      # FULL refresh only: `--update` writes new files but never deletes stale
      # ones, so wipe the canonical react/ trees first or an orphaned flat golden
      # (or a retired spec dir) would survive. A TARGETED refresh (pattern set)
      # must NOT wipe — it re-renders only the matched goldens and leaves the rest.
      - name: Clean canonical react/ goldens before full regen
        if: ${{ inputs.scenario_pattern == '' }}
        run: |
          rm -rf packages/ui-contract/goldens/playwright/__screenshots__/react

      # Re-render the canonical x86 react/ goldens for the sole surviving
      # `playwright` tier — the full theme matrix (5 skins × dark/light) unless
      # SCENARIO_PATTERN narrows it. This is the exact proven pnpm :update
      # script (unchanged), so the tier's vite webServer spawns in the same
      # context it always has. The filter is applied INSIDE the config from
      # $SCENARIO_PATTERN (playwright `grep`) rather than via CLI args, because
      # `pnpm run <script> -- -g X` double-dashes the arg and playwright
      # ignores it. Empty pattern = no filter = full matrix.
      - name: Regenerate playwright goldens
        run: pnpm --filter @rtc/client-react test:ui:visual:playwright:react:update

      # Losslessly recompress the goldens this run CHANGED, before they are
      # committed or uploaded: ~26% smaller with pixel-identical decodes
      # (measured 2026-10-24 on a 201-golden sample), and git stores every golden
      # version whole, so each regen adds that much less to the repository
      # (docs/IDEAS.md, "Shrink the repository"). Visual comparisons decode
      # pixels, so they are unaffected.
      #
      # Only files git sees as modified or new are touched. An unchanged scenario
      # re-renders to byte-identical Playwright output and never enters the list,
      # so adopting this does not rewrite all ~2,000 goldens into history at once.
      # A golden recompressed by an earlier run re-renders to different raw
      # bytes, but recompressing maps them back to the committed bytes, so it
      # drops out of the diff again.
      #
      # oxipng is pinned by version AND checksum: another version may encode the
      # same pixels differently, which would turn every re-rendered golden into
      # a byte change. Downloaded with node (installed above) rather than relying
      # on curl being present in the Playwright image.
      - name: Recompress changed goldens (oxipng, lossless)
        env:
          OXIPNG_VERSION: 10.2.1
          OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          asset="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const [url, out] = process.argv.slice(1);
            const res = await fetch(url);
            if (!res.ok) throw new Error(url + " -> HTTP " + res.status);
            writeFileSync(out, Buffer.from(await res.arrayBuffer()));
          ' "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/${asset}.tar.gz" /tmp/oxipng.tgz
          echo "${OXIPNG_SHA256}  /tmp/oxipng.tgz" | sha256sum -c -
          tar -xzf /tmp/oxipng.tgz -C /tmp --strip-components=1 "${asset}/oxipng"
          git ls-files -z --modified --others --exclude-standard -- \
            packages/ui-contract/goldens/playwright/__screenshots__/react \
            | grep -z '\.png$' \
            | xargs -0 -r /tmp/oxipng -q -o 2 --strip safe

      # Commit the regenerated goldens straight to the dispatched branch. Scope the
      # stage to the canonical react/ tree ONLY — a bare `git add` would also catch
      # a partial react-local/ set. The grep guard hard-fails if anything outside
      # react/ somehow staged.
      # Auto-commit is for PR-branch dispatches only. On main, pushing directly
      # would (a) race concurrent merges (main moves during the ~20-min container
      # run — observed rejected non-fast-forward 2026-07-19, when a full regen
      # still ran all three tiers) and (b) land unreviewed [skip ci] binary
      # changes outside the repo's PR/merge-commit discipline and the post-merge
      # visual backstop. Main dispatches get the artifact below instead — sync it
      # via a normal PR.
      - name: Commit regenerated react/ goldens to the branch
        if: github.ref_name != 'main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/ui-contract/goldens/playwright/__screenshots__/react
          if git diff --cached --name-only | grep -v '__screenshots__/react/' | grep -q .; then
            echo "Refusing to commit paths outside the canonical react/ trees:"
            git diff --cached --name-only | grep -v '__screenshots__/react/'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No golden changes to commit."
          else
            MSG="test(visual): regenerate react/ goldens"
            if [ -n "$SCENARIO_PATTERN" ]; then
              MSG="$MSG (pattern: $SCENARIO_PATTERN)"
            fi
            # NOTE: this marker makes GitHub skip CI for this commit — and it is
            # matched ANYWHERE in a message, so do not quote it verbatim in an
            # unrelated commit. Writing "the bot commits with <that marker>" in a
            # normal commit silently skips that commit's own CI run, which then
            # looks like GitHub failing to materialize a run (PR #422).
            git commit -m "$MSG [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload regenerated goldens (fallback artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-goldens
          path: |
            packages/ui-contract/goldens/playwright/__screenshots__/react/
          if-no-files-found: error
          retention-days: 7
